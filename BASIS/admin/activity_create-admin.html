<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASIS - Admin Create Activity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="activity-admin.css?v=5">
    <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body class="dashboard-page admin-page">

<header class="dash-header">
    <div class="dash-logo">
        <img src="../images/LOGO.png" alt="BASIS Logo">
    </div>
    <div class="header-right">
        <div class="welcome-text">
            <h1>MABUHAY, ADMIN!</h1>
            <span>WELCOME TO BASIS</span>
        </div>
        <div class="profile-avatar-wrapper" onclick="window.location.href='profile-admin.html'">
            <img src="../images/profile_default.jpg" alt="Admin Profile" class="header-avatar">
        </div>
    </div>
</header>

<main class="dash-main">
<section class="page-view active">
        <div class="view-banner">
            <h2>ACTIVITY</h2>
        </div>
        <div class="view-body bordered-frame relative-frame">
            <button class="close-view-btn" onclick="window.location.href='activity-admin.html'"><i class="fa-solid fa-circle-xmark"></i></button>

            <div class="activity-create-grid">
                <div class="create-form-fields">
                    <div class="form-field">
                        <label>ACTIVITY NAME:</label>
                        <input type="text" id="activityName" required>
                    </div>

                    <div class="form-row">
                        <div class="form-field">
                            <label>TYPE OF ACTIVITY:</label>
                            <select id="activityType" required>
                                <option value="" selected disabled>SELECT ACTIVITY TYPE</option>
                                <option value="Municipal Activity">Municipal Activity</option>
                                <option value="Alternative Activity">Alternative Activity</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>DATE:</label>
                            <input type="date" id="activityDate">
                        </div>
                        <div class="form-field">
                            <label>START TIME:</label>
                            <input type="time" id="activityStartTime">
                        </div>
                        <div class="form-field">
                            <label>END TIME:</label>
                            <input type="time" id="activityEndTime">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-field">
                            <label>VENUE:</label>
                            <input type="text" id="activityVenue">
                        </div>
                        <div class="form-field">
                            <label>VENUE ADDRESS:</label>
                            <input type="text" id="activityVenueAddress">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-field">
                            <label>GENERATE QR CODE:</label>
                            <select id="generateQr" required>
                                <option value="both">QR CODE + PROOF SUBMISSION</option>
                                <option value="qr">QR CODE ONLY</option>
                                <option value="proof">PROOF SUBMISSION ONLY</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>DEADLINE OF SUBMISSION:</label>
                            <input type="date" id="activityDeadlineDate">
                        </div>
                        <div class="form-field">
                            <label>TIME:</label>
                            <input type="time" id="activityDeadlineTime">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-field">
                            <label>ACADEMIC YEAR:</label>
                            <input type="text" id="academicYear">
                        </div>
                        <div class="form-field">
                            <label>SEMESTER:</label>
                            <select id="semester"><option value=""></option></select>
                        </div>
                    </div>
                </div>

                <div class="description-field">
                    <textarea id="activityDescription" placeholder="Description..."></textarea>
                    <label for="activityDescriptionImage">ATTACH PICTURE (OPTIONAL):</label>
                    <input type="file" id="activityDescriptionImage" accept="image/jpeg,image/png,image/webp">
                    <img id="activityImagePreview" class="activity-image-preview" alt="Activity image preview" hidden>
                </div>
            </div>

            <div class="create-btn-row">
                <button class="create-btn" onclick="submitNewActivity()">CREATE</button>
            </div>
        </div>
    
</section>
</main>

<nav class="bottom-nav">
    <div class="bottom-nav-inner">
        <a class="nav-item" href="home-admin.html">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a class="nav-item" href="users-admin.html">
            <i class="fa-solid fa-user"></i>
            <span>User</span>
        </a>
        <a class="nav-item" href="scorecard-admin.html">
            <i class="fa-solid fa-address-card"></i>
            <span>Scorecard</span>
        </a>
        <a class="nav-item active" href="activity-admin.html">
            <i class="fa-solid fa-book-open"></i>
            <span>Activity</span>
        </a>
        <a class="nav-item" href="history-admin.html">
            <i class="fa-solid fa-book-bookmark"></i>
            <span>History</span>
        </a>
        <a class="nav-item" href="more-admin.html">
            <i class="fa-solid fa-ellipsis"></i>
            <span>More</span>
        </a>
    </div>
</nav>

<script src="../script.js?v=20260930-tab-auth2"></script>
<script src="activity-admin.js?v=4"></script>

</body>
</html>
