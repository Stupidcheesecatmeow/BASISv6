<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BASIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body class="forgot-page">

    <div class="login-container">
        
        <div class="login-left">
            
            <!-- BACK BUTTON -->
            <a href="login.html" class="back-btn">
                <img src="images/back-btn.png" alt="Back">
            </a>

            <div class="form-wrapper">

                <h1 class="forgot-title">FORGOT PASSWORD<span>ISKOLARS NG BAGAC</span></h1>

                <form action="#" method="POST">
                    <div class="input-group">
                        <label>FULLNAME:</label>
                        <input type="text" required>
                    </div>

                    <div class="input-group email-group">
                        <label>EMAIL ADDRESS:</label>
                        <input type="email" required>
                    </div>

                    <div class="input-group">
                        <label>NEW PASSWORD:</label>
                        <input type="password" required>
                    </div>

                    <div class="input-group">
                        <label>CONFIRM PASSWORD:</label>
                        <input type="password" required>
                    </div>

                    <div class="btn-container">
                        <button type="submit" class="sign-in-btn">SAVE</button>
                    </div>
                </form>

            </div>
        </div>

        <div class="login-right">
            <div class="logo-container">
                <img src="images/LOGO W NAME.png" alt="BASIS Logo">
            </div>
        </div>
    </div>

</body>
</html>
