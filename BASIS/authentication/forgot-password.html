<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BASIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="forgot-password.css?v=3">
    <link rel="stylesheet" href="password-toggle.css?v=20261018-eye-toggle">
    <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body class="forgot-page">

    <div class="login-container">

        <div class="login-left">

            <!-- BACK BUTTON -->
            <a href="login.html" class="back-btn">
                <img src="images/back-btn.png" alt="Back">
            </a>

            <div class="form-wrapper">

                <h1 class="forgot-title">FORGOT PASSWORD<span>ISKOLARS NG BAGAC</span></h1>

                <form id="resetRequestForm">
                    <div class="input-group">
                        <label for="resetEmail">EMAIL ADDRESS:</label>
                        <input type="email" id="resetEmail" required>
                    </div>
                    <p id="resetMessage" role="status" aria-live="polite"></p>

                    <div class="btn-container">
                        <button type="submit" class="sign-in-btn">SAVE</button>
                    </div>
                </form>
                <form id="newPasswordForm" hidden>
                    <div class="input-group"><label for="newPassword">NEW PASSWORD:</label><div class="password-input-wrap"><input type="password" id="newPassword" minlength="8" required><button class="password-toggle" type="button" aria-controls="newPassword" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="password-eye-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
                    <div class="input-group"><label for="confirmPassword">CONFIRM PASSWORD:</label><div class="password-input-wrap"><input type="password" id="confirmPassword" minlength="8" required><button class="password-toggle" type="button" aria-controls="confirmPassword" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="password-eye-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
                    <p id="passwordMessage" role="status" aria-live="polite"></p>
                    <div class="btn-container"><button type="submit" class="sign-in-btn">SAVE PASSWORD</button></div>
                </form>

            </div>
        </div>

        <div class="login-right">
            <div class="logo-container">
                <img src="images/LOGO W NAME.png" alt="BASIS Logo">
            </div>
        </div>
    </div>
    <script src="forgot-password.js?v=4"></script>
    <script src="password-toggle.js?v=20261018-eye-toggle"></script>

</body>
</html>
