<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Temporary Password - BASIS</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="change-password.css?v=20261018-password-toggle">
  <link rel="stylesheet" href="password-toggle.css?v=20261018-eye-toggle">
    <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body class="login-page change-password-page">
  <main class="login-container">
    <section class="login-left">
      <div class="form-wrapper">
        <h1>CHANGE PASSWORD<span>ONE MORE STEP</span></h1>
        <p class="change-password-note">Your account was issued a temporary password. Choose a new password to continue.</p>
        <form id="changePasswordForm">
          <p id="changePasswordMessage" role="status" aria-live="polite"></p>
          <div class="input-group">
            <label for="currentPassword">TEMPORARY PASSWORD:</label>
            <div class="password-input-wrap">
              <input type="password" id="currentPassword" name="current_password" autocomplete="current-password" required>
              <button class="password-toggle" type="button" aria-controls="currentPassword" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="password-eye-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <div class="input-group">
            <label for="newPassword">NEW PASSWORD:</label>
            <div class="password-input-wrap">
              <input type="password" id="newPassword" name="password" minlength="8" autocomplete="new-password" required>
              <button class="password-toggle" type="button" aria-controls="newPassword" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="password-eye-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <div class="input-group">
            <label for="confirmPassword">CONFIRM NEW PASSWORD:</label>
            <div class="password-input-wrap">
              <input type="password" id="confirmPassword" name="confirm_password" minlength="8" autocomplete="new-password" required>
              <button class="password-toggle" type="button" aria-controls="confirmPassword" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="password-eye-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <div class="btn-container"><button type="submit" class="sign-in-btn">SAVE PASSWORD</button></div>
        </form>
        <a class="sign-out-link" href="#" id="signOutLink">Log out</a>
      </div>
    </section>
    <section class="login-right"><div class="logo-container"><img src="images/LOGO W NAME.png" alt="BASIS Logo"></div></section>
  </main>
  <script src="change-password.js?v=20261018-password-toggle"></script>
  <script src="password-toggle.js?v=20261018-eye-toggle"></script>
</body>
</html>
