<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BASIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="password-toggle.css?v=20261018-eye-toggle">
    <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body class="register-page">

    <div class="login-container">
        <div class="login-left">

            <!-- BACK BUTTON -->
            <a href="login.html" class="back-btn">
                <img src="images/back-btn.png" alt="Back">
            </a>

            <div class="form-wrapper">

                <h1>REGISTER HERE!<span>ISKOLARS NG BAGAC</span></h1>

                <form action="#" method="POST">
                    <div class="input-group">
                        <label>GIVEN NAME:</label>
                        <input type="text" required>
                    </div>

                    <div class="name-row">
                        <div class="input-group flex-2">
                            <label>MIDDLE NAME:</label>
                            <input type="text">
                        </div>
                        <div class="input-group flex-2">
                            <label>SURNAME:</label>
                            <input type="text" required>
                        </div>
                        <div class="input-group flex-1">
                            <label>SUFFIX:</label>
                            <input type="text">
                        </div>
                    </div>

                    <div class="name-row">
                        <div class="input-group flex-1">
                            <label>CONTACT NO.:</label>
                            <input type="text" required>
                        </div>
                        <div class="input-group flex-2">
                            <label>EMAIL ADDRESS:</label>
                            <input type="email" required>
                        </div>
                    </div>

                    <div class="input-group password-group">
                        <label for="registerPassword">PASSWORD:</label>
                        <div class="password-input-wrap">
                            <input type="password" id="registerPassword" required>
                            <button class="password-toggle" type="button" aria-controls="registerPassword" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="password-eye-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="registerConfirmPassword">CONFIRM PASSWORD:</label>
                        <div class="password-input-wrap">
                            <input type="password" id="registerConfirmPassword" required>
                            <button class="password-toggle" type="button" aria-controls="registerConfirmPassword" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="password-eye-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                        </div>
                    </div>

                    <div class="btn-container">
                        <button type="submit" class="sign-in-btn">REGISTER</button>
                    </div>
                </form>

            </div>
        </div>

        <div class="login-right">
            <div class="logo-container">
                <img src="images/LOGO W NAME.png" alt="BASIS Logo">
            </div>
        </div>
    </div>

    <script src="password-toggle.js?v=20261018-eye-toggle"></script>

</body>
</html>
