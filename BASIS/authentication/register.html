<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BASIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body class="register-page">

    <div class="login-container">
        <div class="login-left">
            
            <!-- BACK BUTTON -->
            <a href="login.html" class="back-btn">
                <img src="images/back-btn.png" alt="Back">
            </a>

            <div class="form-wrapper">

                <h1>REGISTER HERE!<span>ISKOLARS NG BAGAC</span></h1>

                <form action="#" method="POST">
                    <div class="input-group">
                        <label>GIVEN NAME:</label>
                        <input type="text" required>
                    </div>

                    <div class="name-row">
                        <div class="input-group flex-2">
                            <label>MIDDLE NAME:</label>
                            <input type="text">
                        </div>
                        <div class="input-group flex-2">
                            <label>SURNAME:</label>
                            <input type="text" required>
                        </div>
                        <div class="input-group flex-1">
                            <label>SUFFIX:</label>
                            <input type="text">
                        </div>
                    </div>

                    <div class="name-row">
                        <div class="input-group flex-1">
                            <label>CONTACT NO.:</label>
                            <input type="text" required>
                        </div>
                        <div class="input-group flex-2">
                            <label>EMAIL ADDRESS:</label>
                            <input type="email" required>
                        </div>
                    </div>

                    <div class="input-group password-group">
                        <label>PASSWORD:</label>
                        <input type="password" required>
                    </div>

                    <div class="input-group">
                        <label>CONFIRM PASSWORD:</label>
                        <input type="password" required>
                    </div>

                    <div class="btn-container">
                        <button type="submit" class="sign-in-btn">REGISTER</button>
                    </div>
                </form>

            </div>
        </div>

        <div class="login-right">
            <div class="logo-container">
                <img src="images/LOGO W NAME.png" alt="BASIS Logo">
            </div>
        </div>
    </div>

</body>
</html>
