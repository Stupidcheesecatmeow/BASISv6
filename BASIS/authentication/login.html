<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BASIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-left">
            <div class="form-wrapper">

                <h1>WELCOME<span>ISKOLARS NG BAGAC!</span></h1>

                <form id="loginForm">
                    <p id="loginMessage" role="status" aria-live="polite"></p>
                    <div class="input-group">
                        <label for="email">EMAIL ADDRESS:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">PASSWORD:</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="forgot-password">
                        <a href="forgot-password.html">Forgot Password?</a>
                    </div>


                    <div class="btn-container">
                        <button type="submit" class="sign-in-btn">SIGN IN</button>
                    </div>
                </form>

            </div>
        </div>

        <div class="login-right">
            <div class="logo-container">
                <img src="images/LOGO W NAME.png" alt="BASIS Logo">
            </div>
        </div>
    </div>

    <script src="login.js?v=2"></script>

</body>
</html>
