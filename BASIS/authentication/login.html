<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BASIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="password-toggle.css?v=20261018-eye-toggle">
    <link rel="stylesheet" href="../responsive.css?v=1">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-left">
            <div class="form-wrapper">

                <h1>WELCOME<span>ISKOLARS NG BAGAC!</span></h1>

                <form id="loginForm">
                    <p id="loginMessage" role="status" aria-live="polite"></p>
                    <div class="input-group">
                        <label for="email">EMAIL ADDRESS:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">PASSWORD:</label>
                        <div class="password-input-wrap">
                            <input type="password" id="password" name="password" required>
                            <button class="password-toggle" type="button" aria-controls="password" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="password-eye-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                        </div>
                    </div>

                    <div class="forgot-password">
                        <a href="forgot-password.html">Forgot Password?</a>
                    </div>

                    <label class="login-terms-check" for="acceptTerms" hidden>
                        <input type="checkbox" id="acceptTerms" name="acceptTerms" disabled>
                        <span>I have read and agree to the <button type="button" class="terms-open-link" id="openTerms">Terms and Conditions</button>.</span>
                    </label>


                    <div class="btn-container">
                        <button type="submit" class="sign-in-btn" id="signInButton" disabled>LOGIN</button>
                    </div>
                </form>

            </div>
        </div>

        <div class="login-right">
            <div class="logo-container">
                <img src="images/LOGO W NAME.png" alt="BASIS Logo">
            </div>
        </div>
    </div>

    <div class="terms-modal" id="termsModal" hidden aria-hidden="true">
        <div class="terms-modal-backdrop" data-close-terms></div>
        <section class="terms-dialog" role="dialog" aria-modal="true" aria-labelledby="termsDialogTitle">
            <header class="terms-dialog-header">
                <div><span>BASIS</span><h2 id="termsDialogTitle">Terms and Conditions</h2><p>Please read the terms to the end before agreeing.</p></div>
                <button type="button" class="terms-close" id="closeTerms" aria-label="Close terms">&times;</button>
            </header>
            <div class="terms-dialog-content" id="termsDialogContent" tabindex="0">
                <p class="terms-loading">Loading Terms and Conditions…</p>
            </div>
            <footer class="terms-dialog-footer">
                <span id="termsReadHint">Scroll to the bottom to enable the agreement checkbox.</span>
                <button type="button" class="terms-done-btn" id="termsDone" disabled>DONE</button>
            </footer>
        </section>
    </div>

    <script src="login.js?v=20261022-admin-terms-bypass"></script>
    <script src="password-toggle.js?v=20261018-eye-toggle"></script>

</body>
</html>
